<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Immersive</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#292929,#000);
}

.panel{
    width:min(90%,520px);
    padding:35px;
    text-align:center;
    background:rgba(15,15,15,.95);
    border:1px solid #555;
    border-radius:25px;
}

h1{
    font-size:44px;
    margin:0 0 10px;
}

.subtitle{
    color:#aaa;
    margin-bottom:25px;
}

button{
    border:0;
    border-radius:12px;
    padding:16px 24px;
    margin:7px;
    background:#e10600;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button.secondary{
    background:#333;
}

#status{
    margin-top:15px;
    font-size:14px;
    color:#8f8;
}

#canvas{
    position:fixed;
    inset:0;
}
</style>
</head>

<body>

<div id="menu">

    <div class="panel">

        <h1>🏁 F1 IMMERSIVE</h1>

        <div class="subtitle">
            Formula 1 Mixed Reality<br>
            Meta Quest 3
        </div>

        <button id="start">
            START IMMERSIVE
        </button>

        <button id="tv">
            F1 TV
        </button>

        <div id="status">
            WebXR controleren...
        </div>

    </div>

</div>

<canvas id="canvas"></canvas>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   BASIS
===================================================== */

const canvas =
document.getElementById("canvas");

const menu =
document.getElementById("menu");

const startButton =
document.getElementById("start");

const tvButton =
document.getElementById("tv");

const status =
document.getElementById("status");


let scene;
let camera;
let renderer;

let cars = [];

let raceTrack;


/* =====================================================
   THREE.JS
===================================================== */

scene = new THREE.Scene();

camera =
new THREE.PerspectiveCamera(
    70,
    window.innerWidth /
    window.innerHeight,
    0.01,
    100
);


renderer =
new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true,
    alpha:true
});

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;


/* =====================================================
   LIGHTING
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    )
);

const sun =
new THREE.DirectionalLight(
    0xffffff,
    4
);

sun.position.set(
    5,
    8,
    5
);

scene.add(sun);


/* =====================================================
   MAIN F1 DISPLAY
===================================================== */

const world =
new THREE.Group();

scene.add(world);


/*
   Positie van de hele F1 tafel.

   X = links/rechts
   Y = hoogte
   Z = afstand

   Negatieve Z = vóór de gebruiker
*/

world.position.set(
    0,
    -0.85,
    -2.8
);


/* =====================================================
   TABLE / BASE
===================================================== */

const table =
new THREE.Mesh(
    new THREE.BoxGeometry(
        4.8,
        .15,
        2.8
    ),
    new THREE.MeshStandardMaterial({
        color:0x151515,
        roughness:.7
    })
);

table.position.y =
-0.18;

world.add(table);


/* =====================================================
   GRASS PLATFORM
===================================================== */

const grass =
new THREE.Mesh(
    new THREE.BoxGeometry(
        4.4,
        .12,
        2.4
    ),
    new THREE.MeshStandardMaterial({
        color:0x173d1c
    })
);

grass.position.y =
-0.04;

world.add(grass);


/* =====================================================
   TRACK
===================================================== */

const points = [

    new THREE.Vector3(-1.75,0,-0.55),
    new THREE.Vector3(-1.45,0,-0.95),
    new THREE.Vector3(-0.55,0,-1.05),
    new THREE.Vector3(0.55,0,-0.95),
    new THREE.Vector3(1.55,0,-0.55),
    new THREE.Vector3(1.75,0,0.15),
    new THREE.Vector3(1.35,0,0.75),
    new THREE.Vector3(0.45,0,0.9),
    new THREE.Vector3(-0.55,0,0.85),
    new THREE.Vector3(-1.65,0,0.65),
    new THREE.Vector3(-1.9,0,0.05),
    new THREE.Vector3(-1.75,0,-0.55)

];


raceTrack =
new THREE.CatmullRomCurve3(
    points,
    true
);


/*
   Road
*/

const road =
new THREE.Mesh(
    new THREE.TubeGeometry(
        raceTrack,
        220,
        .22,
        16,
        true
    ),
    new THREE.MeshStandardMaterial({
        color:0x202020,
        roughness:.8
    })
);

road.position.y =
0.08;

world.add(road);


/*
   White racing line
*/

const line =
new THREE.Mesh(
    new THREE.TubeGeometry(
        raceTrack,
        220,
        .012,
        6,
        true
    ),
    new THREE.MeshBasicMaterial({
        color:0xffffff
    })
);

line.position.y =
0.31;

world.add(line);


/* =====================================================
   KERBS
===================================================== */

const kerbPoints =
raceTrack.getPoints(220);

const kerbGeometry =
new THREE.BufferGeometry().setFromPoints(
    kerbPoints
);

const kerb =
new THREE.LineLoop(
    kerbGeometry,
    new THREE.LineBasicMaterial({
        color:0xff2222
    })
);

kerb.position.y =
0.32;

world.add(kerb);


/* =====================================================
   START FINISH
===================================================== */

const finish =
new THREE.Mesh(
    new THREE.BoxGeometry(
        .08,
        .025,
        .55
    ),
    new THREE.MeshBasicMaterial({
        color:0xffffff
    })
);

finish.position.set(
    -1.72,
    .33,
    -.55
);

world.add(finish);


/* =====================================================
   CARS
===================================================== */

const colors = [
    0xe10600,
    0x008cff,
    0xffff00,
    0x00ff66,
    0xffffff,
    0xff8800,
    0xff00aa,
    0x8888ff
];


function createCar(color){

    const car =
    new THREE.Group();


    /*
       Main body
    */

    const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .16,
            .055,
            .38
        ),
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.4
        })
    );

    car.add(body);


    /*
       Nose
    */

    const nose =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .055,
            .035,
            .20
        ),
        new THREE.MeshStandardMaterial({
            color:color
        })
    );

    nose.position.z =
    -.27;

    car.add(nose);


    /*
       Front wing
    */

    const wing =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .25,
            .018,
            .05
        ),
        new THREE.MeshStandardMaterial({
            color:0x111111
        })
    );

    wing.position.z =
    -.36;

    car.add(wing);


    /*
       Rear wing
    */

    const rear =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .23,
            .035,
            .045
        ),
        new THREE.MeshStandardMaterial({
            color:0x111111
        })
    );

    rear.position.z =
    .20;

    car.add(rear);


    /*
       Wheels
    */

    const wheelMaterial =
    new THREE.MeshStandardMaterial({
        color:0x050505
    });


    const wheelGeometry =
    new THREE.CylinderGeometry(
        .035,
        .035,
        .025,
        12
    );


    const wheelPositions = [
        [-.09,-.025,-.15],
        [.09,-.025,-.15],
        [-.09,-.025,.15],
        [.09,-.025,.15]
    ];


    wheelPositions.forEach(p => {

        const wheel =
        new THREE.Mesh(
            wheelGeometry,
            wheelMaterial
        );

        wheel.rotation.z =
        Math.PI/2;

        wheel.position.set(
            p[0],
            p[1],
            p[2]
        );

        car.add(wheel);

    });


    return car;
}


/*
   Create cars
*/

for(let i=0;i<8;i++){

    const car =
    createCar(colors[i]);

    world.add(car);

    cars.push({
        mesh:car,
        progress:i/8,
        speed:.0007 - i*.000025
    });

}


/* =====================================================
   TV SCREEN
===================================================== */

const tvGroup =
new THREE.Group();


/*
   Screen position:
   behind the circuit and higher.
*/

tvGroup.position.set(
    0,
    1.45,
    -0.55
);

world.add(tvGroup);


/*
   Screen frame
*/

const frame =
new THREE.Mesh(
    new THREE.BoxGeometry(
        3.9,
        2.15,
        .08
    ),
    new THREE.MeshStandardMaterial({
        color:0x090909,
        roughness:.3
    })
);

tvGroup.add(frame);


/*
   Actual screen
*/

const screen =
new THREE.Mesh(
    new THREE.PlaneGeometry(
        3.65,
        1.9
    ),
    new THREE.MeshBasicMaterial({
        color:0x111111
    })
);

screen.position.z =
-.055;

tvGroup.add(screen);


/*
   F1 TV placeholder graphics
*/

const screenText =
new THREE.Mesh(
    new THREE.PlaneGeometry(
        3.2,
        1.5
    ),
    new THREE.MeshBasicMaterial({
        color:0x1a1a1a
    })
);

screenText.position.z =
-.065;

tvGroup.add(screenText);


/* =====================================================
   TIMING SCREEN
===================================================== */

const timing =
new THREE.Mesh(
    new THREE.PlaneGeometry(
        1.15,
        .72
    ),
    new THREE.MeshBasicMaterial({
        color:0x222222,
        transparent:true,
        opacity:.92
    })
);

timing.position.set(
    1.9,
    .65,
    -.15
);

timing.rotation.y =
-0.25;

world.add(timing);


/* =====================================================
   CAR ANIMATION
===================================================== */

function updateCars(){

    cars.forEach(car => {

        car.progress +=
        car.speed;


        if(car.progress >= 1){
            car.progress -= 1;
        }


        const pos =
        raceTrack.getPointAt(
            car.progress
        );


        const tangent =
        raceTrack.getTangentAt(
            car.progress
        );


        car.mesh.position.set(
            pos.x,
            pos.y + .38,
            pos.z
        );


        car.mesh.rotation.y =
        Math.atan2(
            tangent.x,
            tangent.z
        );

    });

}


/* =====================================================
   WEBXR
===================================================== */

async function checkXR(){

    if(!navigator.xr){

        status.textContent =
        "WebXR niet beschikbaar.";

        return false;
    }


    try{

        const supported =
        await navigator.xr.isSessionSupported(
            "immersive-ar"
        );


        if(supported){

            status.textContent =
            "✓ Quest 3 immersive AR beschikbaar";

            return true;

        }


        status.textContent =
        "Immersive AR niet beschikbaar.";

        return false;

    }catch(error){

        console.error(error);

        status.textContent =
        "WebXR controle mislukt.";

        return false;

    }

}


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
"click",
async function(){

    const supported =
    await checkXR();


    if(!supported){
        return;
    }


    try{

        const session =
        await navigator.xr.requestSession(
            "immersive-ar",
            {
                requiredFeatures:[
                    "local-floor"
                ]
            }
        );


        await renderer.xr.setSession(
            session
        );


        menu.style.display =
        "none";


        renderer.setAnimationLoop(
        function(){

            updateCars();

            renderer.render(
                scene,
                camera
            );

        });


    }catch(error){

        console.error(error);

        status.textContent =
        "Immersive starten mislukt.";

    }

});


/* =====================================================
   F1 TV
===================================================== */

tvButton.addEventListener(
"click",
function(){

    window.location.href =
    "https://f1tv.formula1.com/";

});


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
"resize",
function(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


checkXR();

</script>

</body>
</html>
