<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Immersive</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 35%,#25282c,#08090a 65%,#000);
}

.startCard{
    width:min(88vw,480px);
    padding:34px;
    text-align:center;
    background:rgba(12,14,16,.90);
    border:1px solid rgba(255,255,255,.16);
    border-radius:24px;
    box-shadow:0 25px 90px rgba(0,0,0,.8);
}

.startCard h1{
    margin:0 0 8px;
    font-size:38px;
    letter-spacing:3px;
}

.startCard p{
    color:#aeb2b6;
    margin:0 0 25px;
}

button{
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    padding:14px 22px;
    margin:5px;
    background:#e10600;
    color:white;
    font-size:15px;
    font-weight:bold;
}

button.secondary{
    background:#202326;
}

#status{
    margin-top:16px;
    color:#aaa;
    font-size:13px;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<div id="menu">

    <div class="startCard">

        <h1>F1 IMMERSIVE</h1>

        <p>
            Spatial Formula 1<br>
            Meta Quest 3
        </p>

        <button id="start">
            START IMMERSIVE
        </button>

        <button class="secondary" id="tv">
            F1 TV
        </button>

        <button class="secondary" id="multi">
            MULTIVIEW
        </button>

        <div id="status">
            WebXR controleren...
        </div>

    </div>

</div>

<canvas id="c"></canvas>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   BASIS
===================================================== */

const menu =
document.getElementById("menu");

const status =
document.getElementById("status");

const scene =
new THREE.Scene();

const camera =
new THREE.PerspectiveCamera(
    62,
    innerWidth / innerHeight,
    .01,
    100
);

const renderer =
new THREE.WebGLRenderer({

    canvas:
    document.getElementById("c"),

    antialias:true,

    alpha:true

});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.xr.enabled = true;


/* =====================================================
   LICHT
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x303030,
        3
    )
);

const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    4,
    8,
    5
);

scene.add(light);


/* =====================================================
   WERELD
===================================================== */

const world =
new THREE.Group();

/*
   Baan compact vóór de gebruiker.
*/

world.position.set(
    0,
    -0.92,
    -3.25
);

world.scale.setScalar(
    .72
);

scene.add(world);


/* =====================================================
   BASIS
===================================================== */

const base =
new THREE.Mesh(

    new THREE.BoxGeometry(
        4.8,
        .15,
        2.65
    ),

    new THREE.MeshStandardMaterial({
        color:0x111315,
        roughness:.8
    })

);

base.position.y =
-.17;

world.add(base);


const grass =
new THREE.Mesh(

    new THREE.BoxGeometry(
        4.55,
        .10,
        2.42
    ),

    new THREE.MeshStandardMaterial({
        color:0x203a25,
        roughness:.9
    })

);

grass.position.y =
-.08;

world.add(grass);


/* =====================================================
   CIRCUIT
===================================================== */

const points = [

    [-1.65,-.45],
    [-1.25,-.88],
    [-.35,-.98],
    [.65,-.85],
    [1.45,-.45],
    [1.62,.10],
    [1.28,.65],
    [.45,.78],
    [-.45,.72],
    [-1.48,.50],
    [-1.72,.02]

].map(

    p =>
    new THREE.Vector3(
        p[0],
        0,
        p[1]
    )

);

const track =
new THREE.CatmullRomCurve3(
    points,
    true
);


/* =====================================================
   ASFALT
===================================================== */

const road =
new THREE.Mesh(

    new THREE.TubeGeometry(
        track,
        280,
        .21,
        16,
        true
    ),

    new THREE.MeshStandardMaterial({
        color:0x25282b,
        roughness:.8
    })

);

road.position.y =
.05;

world.add(road);


/* =====================================================
   CIRCUIT LIJN
===================================================== */

const circuitLine =
new THREE.Mesh(

    new THREE.TubeGeometry(
        track,
        280,
        .012,
        6,
        true
    ),

    new THREE.MeshBasicMaterial({
        color:0xffffff
    })

);

circuitLine.position.y =
.275;

world.add(circuitLine);


/* =====================================================
   KERBS
===================================================== */

for(let i=0;i<90;i++){

    const p =
    track.getPointAt(
        i/90
    );

    const kerb =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .055,
            .018,
            .105
        ),

        new THREE.MeshBasicMaterial({

            color:
            i % 2
            ? 0xffffff
            : 0xe10600

        })

    );

    kerb.position.set(
        p.x,
        .29,
        p.z
    );

    world.add(kerb);
}


/* =====================================================
   START FINISH
===================================================== */

const finish =
new THREE.Mesh(

    new THREE.BoxGeometry(
        .10,
        .025,
        .52
    ),

    new THREE.MeshBasicMaterial({
        color:0xffffff
    })

);

finish.position.set(
    -1.60,
    .30,
    -.45
);

world.add(finish);


/* =====================================================
   F1 AUTO
===================================================== */

const carColors = [

    0xe10600,
    0x1677ff,
    0xffd400,
    0x00c878,
    0xffffff,
    0xff7a00,
    0xb05cff,
    0x55c7ff

];

const cars=[];


function createCar(color){

    const g =
    new THREE.Group();

    const bodyMaterial =
    new THREE.MeshStandardMaterial({
        color:color,
        roughness:.35
    });


    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .13,
            .05,
            .34
        ),

        bodyMaterial

    );

    g.add(body);


    const nose =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .045,
            .03,
            .18
        ),

        bodyMaterial

    );

    nose.position.z =
    -.23;

    g.add(nose);


    const frontWing =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .20,
            .015,
            .04
        ),

        new THREE.MeshStandardMaterial({
            color:0x080808
        })

    );

    frontWing.position.z =
    -.30;

    g.add(frontWing);


    const rearWing =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .19,
            .025,
            .04
        ),

        new THREE.MeshStandardMaterial({
            color:0x080808
        })

    );

    rearWing.position.z =
    .17;

    g.add(rearWing);


    return g;
}


for(let i=0;i<8;i++){

    const c =
    createCar(
        carColors[i]
    );

    world.add(c);

    cars.push({

        mesh:c,

        t:i/8,

        speed:
        .00072 -
        i*.000014

    });

}


/* =====================================================
   SCHERM TEXTURE
===================================================== */

function makeTexture(
    title,
    rows,
    accent="#e10600"
){

    const canvas =
    document.createElement(
        "canvas"
    );

    canvas.width=900;
    canvas.height=520;

    const ctx =
    canvas.getContext("2d");


    /*
       Donkere premium achtergrond.
    */

    ctx.fillStyle =
    "#101214";

    ctx.fillRect(
        0,
        0,
        900,
        520
    );


    /*
       F1 rode accentlijn.
    */

    ctx.fillStyle =
    accent;

    ctx.fillRect(
        0,
        0,
        7,
        520
    );


    /*
       Titel.
    */

    ctx.fillStyle =
    "#ffffff";

    ctx.font =
    "bold 36px Arial";

    ctx.fillText(
        title,
        35,
        55
    );


    /*
       subtiele scheidingslijn.
    */

    ctx.strokeStyle =
    "rgba(255,255,255,.15)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        35,
        78
    );

    ctx.lineTo(
        865,
        78
    );

    ctx.stroke();


    ctx.font =
    "22px Arial";


    rows.forEach(
        (row,index)=>{

            ctx.fillStyle =
            index===0
            ? "#ffffff"
            : "#b9bec3";

            ctx.fillText(
                row,
                35,
                120 + index*43
            );

        }
    );


    return new THREE.CanvasTexture(
        canvas
    );

}


/* =====================================================
   SPATIAL PANEL
===================================================== */

function makePanel(
    title,
    rows,
    width,
    height,
    position,
    rotation=0,
    accent="#e10600"
){

    const group =
    new THREE.Group();

    group.position.set(
        ...position
    );

    group.rotation.y =
    rotation;


    /*
       Zachte schaduw.
    */

    const shadow =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            width+.10,
            height+.10
        ),

        new THREE.MeshBasicMaterial({

            color:0x000000,

            transparent:true,

            opacity:.40

        })

    );

    shadow.position.set(
        .035,
        -.035,
        .035
    );

    group.add(shadow);


    /*
       Dun frame.
    */

    const frame =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            width+.035,
            height+.035
        ),

        new THREE.MeshBasicMaterial({

            color:0x45494d,

            transparent:true,

            opacity:.85

        })

    );

    group.add(frame);


    /*
       Scherm.
    */

    const screen =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            height
        ),

        new THREE.MeshBasicMaterial({

            map:
            makeTexture(
                title,
                rows,
                accent
            )

        })

    );

    screen.position.z =
    -.025;

    group.add(screen);


    world.add(group);


    return group;
}


/* =====================================================
   HOOFDSCHERM
===================================================== */

makePanel(

    "F1 TV",

    [

        "LIVE RACE",
        "MAIN BROADCAST",
        "F1 TV ACCOUNT",
        "",
        "MULTIVIEW AVAILABLE"

    ],

    3.25,
    1.82,

    [
        0,
        1.55,
        -.35
    ]

);


/* =====================================================
   TIMING
===================================================== */

const timingPanel =
makePanel(

    "LIVE TIMING",

    [

        "P1  VER   +0.000",
        "P2  LEC   +2.735",
        "P3  NOR   +3.219",
        "P4  PIA   +4.669",
        "P5  HAM   +5.601",
        "",
        "LAP 18 / 72"

    ],

    1.18,
    1.35,

    [
        2.08,
        1.02,
        -.30
    ],

    -.10,

    "#e10600"

);


/* =====================================================
   MULTIVIEW
===================================================== */

const multiPanel =
makePanel(

    "MULTIVIEW",

    [

        "MAIN FEED",
        "ONBOARD",
        "TRACK CAMERA",
        "DRIVER CAMERA",
        "",
        "OPEN EXTRA FEED"

    ],

    1.18,
    1.18,

    [
        2.05,
        -.08,
        -.25
    ],

    -.08,

    "#e10600"

);


/* =====================================================
   LINKER BEDIENING
===================================================== */

const controlPanel =
makePanel(

    "F1 IMMERSIVE",

    [

        "●  F1 TV",
        "▦  MULTIVIEW",
        "◉  TIMING",
        "⚙  SETTINGS",
        "×  CLOSE"

    ],

    .92,
    1.45,

    [
        -2.02,
        .72,
        -.22
    ],

    .08,

    "#e10600"

);


/* =====================================================
   STATUS ONDER BAAN
===================================================== */

makePanel(

    "F1 IMMERSIVE",

    [

        "SPATIAL RACE VIEW"

    ],

    1.55,
    .38,

    [
        0,
        -.47,
        -.28
    ],

    0,

    "#e10600"

);


/* =====================================================
   AUTO ANIMATIE
===================================================== */

function updateCars(){

    cars.forEach(
        car=>{

            car.t +=
            car.speed;


            if(car.t>=1){
                car.t-=1;
            }


            const p =
            track.getPointAt(
                car.t
            );


            const tangent =
            track.getTangentAt(
                car.t
            );


            car.mesh.position.set(

                p.x,

                .32,

                p.z

            );


            car.mesh.rotation.y =
            Math.atan2(
                tangent.x,
                tangent.z
            );

        }
    );

}


/* =====================================================
   WEBXR
===================================================== */

async function checkXR(){

    if(!navigator.xr){

        status.textContent =
        "WebXR niet beschikbaar.";

        return false;

    }


    try{

        const supported =
        await navigator.xr.isSessionSupported(
            "immersive-ar"
        );


        status.textContent =
        supported
        ? "✓ Quest 3 immersive AR beschikbaar"
        : "Immersive AR niet beschikbaar.";


        return supported;

    }
    catch(error){

        console.error(error);

        status.textContent =
        "WebXR controle mislukt.";

        return false;

    }

}


/* =====================================================
   START
===================================================== */

document.getElementById(
    "start"
).onclick =
async()=>{

    if(!await checkXR()){
        return;
    }


    try{

        const session =
        await navigator.xr.requestSession(

            "immersive-ar",

            {
                requiredFeatures:[
                    "local-floor"
                ],

                optionalFeatures:[
                    "hand-tracking",
                    "bounded-floor"
                ]

            }

        );


        await renderer.xr.setSession(
            session
        );


        menu.style.display =
        "none";


        renderer.setAnimationLoop(
            ()=>{

                updateCars();

                renderer.render(
                    scene,
                    camera
                );

            }
        );


    }
    catch(error){

        console.error(error);

        status.textContent =
        "Immersive starten mislukt.";

    }

};


/* =====================================================
   F1 TV
===================================================== */

document.getElementById(
    "tv"
).onclick =
()=>{

    window.open(
        "https://f1tv.formula1.com/",
        "_blank"
    );

};


/* =====================================================
   MULTIVIEW
===================================================== */

document.getElementById(
    "multi"
).onclick =
()=>{

    window.open(
        "https://f1tv.formula1.com/",
        "_blank"
    );

};


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
        innerWidth /
        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   START CHECK
===================================================== */

checkXR();

</script>

</body>
</html>
