<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>F1 Immersive</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

#menu{
    position:absolute;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #17191c 0%,
            #08090a 55%,
            #000 100%
        );

    color:white;
}

#menu h1{
    margin:0 0 10px;

    font-size:42px;
    letter-spacing:4px;
}

#menu p{
    margin:0 0 30px;
    color:#999;
}

#start{
    border:1px solid #e10600;

    background:#111;
    color:white;

    padding:16px 32px;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;
}

#start:hover{
    background:#e10600;
}

</style>
</head>


<body>


<div id="menu">

    <h1>F1 IMMERSIVE</h1>

    <p>
        Formula 1 virtual experience
    </p>

    <button id="start">
        ENTER IMMERSIVE MODE
    </button>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x050505);


const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        .01,
        100
    );

camera.position.set(
    0,
    1.6,
    3
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled=true;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x202020,
        1.4
    );

scene.add(hemi);


const directional =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

directional.position.set(
    3,
    6,
    4
);

scene.add(directional);


/* =========================================================
   WORLD
   GOLDEN LAYOUT
========================================================= */

const world =
    new THREE.Group();


let worldHeight=.78;


world.position.set(
    0,
    worldHeight,
    -3.25
);


world.scale.setScalar(.48);


scene.add(world);


/* =========================================================
   TRACK WORLD
========================================================= */

const trackWorld =
    new THREE.Group();


trackWorld.scale.setScalar(.55);


world.add(trackWorld);


/* =========================================================
   TRACK
========================================================= */

const points=[

    [-1.65,-.45],
    [-1.25,-.88],
    [-.35,-.98],
    [.65,-.85],
    [1.45,-.45],
    [1.62,.10],
    [1.28,.65],
    [.45,.78],
    [-.45,.72],
    [-1.48,.50],
    [-1.72,.02]

].map(
    p =>
        new THREE.Vector3(
            p[0],
            0,
            p[1]
        )
);


const track =
    new THREE.CatmullRomCurve3(
        points,
        true
    );


/* =========================================================
   TRACK BASE
========================================================= */

const base =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            2.25,
            2.25,
            .08,
            64
        ),

        new THREE.MeshStandardMaterial({
            color:0x151515,
            roughness:.9
        })

    );

base.position.y=-.08;

trackWorld.add(base);


/* =========================================================
   GRASS
========================================================= */

const grass =
    new THREE.Mesh(

        new THREE.CircleGeometry(
            2.08,
            64
        ),

        new THREE.MeshStandardMaterial({
            color:0x1a301c,
            roughness:1
        })

    );

grass.rotation.x=
    -Math.PI/2;

grass.position.y=
    -.035;

trackWorld.add(grass);


/* =========================================================
   RED BORDER
========================================================= */

const border =
    new THREE.Mesh(

        new THREE.TubeGeometry(
            track,
            180,
            .095,
            8,
            true
        ),

        new THREE.MeshStandardMaterial({
            color:0xb00000,
            roughness:.8
        })

    );

border.position.y=.005;

trackWorld.add(border);


/* =========================================================
   ROAD
========================================================= */

const road =
    new THREE.Mesh(

        new THREE.TubeGeometry(
            track,
            220,
            .34,
            16,
            true
        ),

        new THREE.MeshStandardMaterial({
            color:0x252525,
            roughness:.92
        })

    );

road.position.y=.015;

trackWorld.add(road);


/* =========================================================
   ROAD LINE
========================================================= */

const roadLine =
    new THREE.Mesh(

        new THREE.TubeGeometry(
            track,
            220,
            .012,
            6,
            true
        ),

        new THREE.MeshBasicMaterial({
            color:0xffffff
        })

    );

roadLine.position.y=.36;

trackWorld.add(roadLine);


/* =========================================================
   KERBS
========================================================= */

for(
    let i=0;
    i<90;
    i++
){

    const t=i/90;

    const p=
        track.getPointAt(t);

    const tangent=
        track
            .getTangentAt(t)
            .normalize();

    const normal=
        new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        ).normalize();


    const kerb =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .12,
                .035,
                .12
            ),

            new THREE.MeshStandardMaterial({
                color:
                    i%2===0
                    ?0xe10600
                    :0xffffff
            })

        );


    kerb.position.copy(
        p.add(
            normal.multiplyScalar(.39)
        )
    );

    kerb.position.y=.055;

    kerb.rotation.y=
        Math.atan2(
            tangent.x,
            tangent.z
        );

    trackWorld.add(kerb);
}


/* =========================================================
   CARS
========================================================= */

const carColors=[
    0xe10600,
    0xffffff,
    0x00aaff,
    0xffcc00,
    0x00cc66,
    0xff6600,
    0xaa00ff,
    0xaaaaaa
];


const cars=[];


for(
    let i=0;
    i<8;
    i++
){

    const car =
        new THREE.Group();


    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .13,
                .035,
                .30
            ),

            new THREE.MeshStandardMaterial({
                color:carColors[i],
                roughness:.5
            })

        );

    car.add(body);


    const nose =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .055,
                .025,
                .17
            ),

            new THREE.MeshStandardMaterial({
                color:carColors[i]
            })

        );

    nose.position.z=-.22;

    car.add(nose);


    const wing =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .19,
                .018,
                .035
            ),

            new THREE.MeshStandardMaterial({
                color:0x111111
            })

        );

    wing.position.z=-.14;

    car.add(wing);


    trackWorld.add(car);


    cars.push({

        mesh:car,

        offset:i/8

    });
}


/* =========================================================
   CANVAS
========================================================= */

function makeCanvas(
    width=900,
    height=700
){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width=width;

    canvas.height=height;

    return canvas;
}


/* =========================================================
   F1 TV MAIN SCREEN
========================================================= */

function cleanF1TVTexture(){

    const canvas =
        makeCanvas(
            1400,
            760
        );

    const ctx =
        canvas.getContext("2d");


    /* background */

    const bg =
        ctx.createLinearGradient(
            0,
            0,
            0,
            760
        );

    bg.addColorStop(
        0,
        "#111315"
    );

    bg.addColorStop(
        .55,
        "#050506"
    );

    bg.addColorStop(
        1,
        "#000000"
    );


    ctx.fillStyle=bg;

    ctx.fillRect(
        0,
        0,
        1400,
        760
    );


    /* red F1 accent */

    ctx.fillStyle="#e10600";

    ctx.fillRect(
        0,
        0,
        1400,
        4
    );


    /* very subtle shine */

    const shine =
        ctx.createLinearGradient(
            0,
            0,
            1400,
            0
        );

    shine.addColorStop(
        0,
        "rgba(255,255,255,0)"
    );

    shine.addColorStop(
        .5,
        "rgba(255,255,255,.045)"
    );

    shine.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.fillStyle=shine;

    ctx.fillRect(
        0,
        1,
        1400,
        2
    );


    /* center F1 TV identity */

    ctx.fillStyle=
        "rgba(255,255,255,.07)";

    ctx.font=
        "bold 42px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "F1 TV",
        700,
        390
    );


    ctx.textAlign="left";


    /* vignette */

    const vignette =
        ctx.createRadialGradient(
            700,
            380,
            160,
            700,
            380,
            750
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.55)"
    );


    ctx.fillStyle=vignette;

    ctx.fillRect(
        0,
        0,
        1400,
        760
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.needsUpdate=true;

    return texture;
}


/* =========================================================
   TIMING
========================================================= */

function timingTexture(){

    const canvas =
        makeCanvas(
            900,
            900
        );

    const ctx =
        canvas.getContext("2d");


    const bg =
        ctx.createLinearGradient(
            0,
            0,
            0,
            900
        );

    bg.addColorStop(
        0,
        "#151719"
    );

    bg.addColorStop(
        1,
        "#050506"
    );


    ctx.fillStyle=bg;

    ctx.fillRect(
        0,
        0,
        900,
        900
    );


    ctx.fillStyle="#e10600";

    ctx.fillRect(
        0,
        0,
        900,
        10
    );


    ctx.fillStyle="#fff";

    ctx.font=
        "bold 45px Arial";

    ctx.fillText(
        "LIVE TIMING",
        40,
        70
    );


    ctx.fillStyle="#777";

    ctx.font=
        "18px Arial";

    ctx.fillText(
        "F1 LIVE DATA",
        42,
        100
    );


    ctx.fillStyle="#777";

    ctx.font=
        "bold 19px Arial";

    ctx.fillText(
        "POS",
        45,
        160
    );

    ctx.fillText(
        "DRIVER",
        180,
        160
    );

    ctx.fillText(
        "GAP",
        690,
        160
    );


    const rows=[
        ["P1","VER","+0.000"],
        ["P2","LEC","+2.735"],
        ["P3","NOR","+3.219"],
        ["P4","PIA","+4.669"],
        ["P5","HAM","+5.601"]
    ];


    rows.forEach(
        (row,index)=>{

            const y=
                215+
                index*82;


            ctx.fillStyle=
                index===0
                ?"rgba(225,6,0,.20)"
                :"rgba(255,255,255,.035)";


            ctx.fillRect(
                30,
                y-42,
                840,
                62
            );


            ctx.fillStyle="#fff";

            ctx.font=
                "bold 23px Arial";


            ctx.fillText(
                row[0],
                50,
                y
            );


            ctx.fillText(
                row[1],
                180,
                y
            );


            ctx.fillStyle="#aaa";

            ctx.font=
                "21px Arial";


            ctx.fillText(
                row[2],
                690,
                y
            );

        }
    );


    ctx.fillStyle="#666";

    ctx.font=
        "17px Arial";


    ctx.fillText(
        "CURRENT LAP 18 / 72",
        45,
        700
    );

    ctx.fillText(
        "LEADER  VER",
        45,
        735
    );

    ctx.fillText(
        "STATUS  LIVE",
        45,
        770
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.needsUpdate=true;

    return texture;
}


/* =========================================================
   MULTIVIEW
========================================================= */

const multiViews=[
    "MAIN FEED",
    "ONBOARD",
    "TRACK CAM",
    "DRIVER CAM"
];


let selectedView=0;


function multiTexture(){

    const canvas =
        makeCanvas(
            900,
            900
        );

    const ctx =
        canvas.getContext("2d");


    const bg =
        ctx.createLinearGradient(
            0,
            0,
            0,
            900
        );

    bg.addColorStop(
        0,
        "#151719"
    );

    bg.addColorStop(
        1,
        "#050506"
    );


    ctx.fillStyle=bg;

    ctx.fillRect(
        0,
        0,
        900,
        900
    );


    ctx.fillStyle="#e10600";

    ctx.fillRect(
        0,
        0,
        900,
        10
    );


    ctx.fillStyle="#fff";

    ctx.font=
        "bold 38px Arial";

    ctx.fillText(
        "MULTIVIEW",
        38,
        62
    );


    ctx.fillStyle="#777";

    ctx.font=
        "15px Arial";

    ctx.fillText(
        "SELECT CAMERA VIEW",
        40,
        91
    );


    multiViews.forEach(
        (name,index)=>{

            const y=
                130+
                index*112;


            const active=
                index===selectedView;


            ctx.fillStyle=
                active
                ?"rgba(225,6,0,.22)"
                :"rgba(255,255,255,.04)";


            ctx.fillRect(
                35,
                y,
                830,
                76
            );


            ctx.strokeStyle=
                active
                ?"rgba(225,6,0,.85)"
                :"rgba(255,255,255,.08)";


            ctx.lineWidth=2;


            ctx.strokeRect(
                35,
                y,
                830,
                76
            );


            ctx.fillStyle=
                active
                ?"#e10600"
                :"#555";


            ctx.fillRect(
                35,
                y,
                5,
                76
            );


            ctx.fillStyle=
                active
                ?"white"
                :"#aaa";


            ctx.font=
                "bold 19px Arial";


            ctx.fillText(
                name,
                65,
                y+47
            );


            if(active){

                ctx.fillStyle=
                    "#e10600";

                ctx.font=
                    "bold 12px Arial";

                ctx.fillText(
                    "ACTIVE",
                    750,
                    y+47
                );
            }

        }
    );


    ctx.fillStyle="#777";

    ctx.font=
        "14px Arial";


    ctx.fillText(
        "OPEN F1 TV FOR LIVE MULTIVIEW",
        40,
        620
    );


    ctx.fillStyle="#555";

    ctx.fillRect(
        40,
        650,
        820,
        1
    );


    ctx.fillStyle="#888";

    ctx.fillText(
        "LIVE CAMERA SELECTION",
        40,
        690
    );


    ctx.fillStyle="#555";

    ctx.fillText(
        "F1 TV handles the actual live feeds",
        40,
        720
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.needsUpdate=true;

    return texture;
}


/* =========================================================
   PANEL CREATOR
========================================================= */

function panel(
    title,
    rows,
    width,
    height,
    position,
    rotationY=0
){

    const group =
        new THREE.Group();


    group.position.set(
        position[0],
        position[1],
        position[2]
    );


    group.rotation.y=
        rotationY;


    let tex;


    if(title==="F1 TV"){

        tex=
            cleanF1TVTexture();

    }

    else if(title==="LIVE TIMING"){

        tex=
            timingTexture();

    }

    else if(title==="MULTIVIEW"){

        tex=
            multiTexture();

    }

    else{

        tex=
            new THREE.CanvasTexture(
                makeCanvas()
            );
    }


    const frame =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width+.045,
                height+.045,
                .055
            ),

            new THREE.MeshBasicMaterial({
                color:0x3b3f43
            })

        );


    frame.position.z=-.035;

    group.add(frame);


    const screen =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            new THREE.MeshBasicMaterial({
                map:tex
            })

        );


    group.add(screen);


    group.userData.frame=
        frame;

    group.userData.screen=
        screen;

    group.userData.title=
        title;


    world.add(group);


    return group;
}


/* =========================================================
   PANELS
   EXACT ORIGINAL POSITIONS
========================================================= */

const mainPanel =
    panel(
        "F1 TV",
        [],
        3.65,
        1.90,
        [0,1.45,-1.05]
    );


const timingPanel =
    panel(
        "LIVE TIMING",
        [],
        1.20,
        1.25,
        [2.60,1.45,-.80],
        -.10
    );


const multiPanel =
    panel(
        "MULTIVIEW",
        [],
        1.20,
        1.08,
        [2.60,.10,-.80],
        -.08
    );


/* =========================================================
   APP STATE
========================================================= */

let activeSection=null;

let timingVisible=true;

let multiVisible=true;

let f1TVMode=false;

let f1TVWindow=null;

let multiViewWindow=null;


/* =========================================================
   PANEL FRAME STATES
========================================================= */

function updatePanelFrames(){

    mainPanel.userData.frame
        .material.color.set(
            activeSection==="tv"
            ?0xe10600
            :0x3b3f43
        );


    timingPanel.userData.frame
        .material.color.set(
            activeSection==="timing"
            ?0xe10600
            :0x3b3f43
        );


    multiPanel.userData.frame
        .material.color.set(
            activeSection==="multi"
            ?0xe10600
            :0x3b3f43
        );
}


function setActiveSection(
    section
){

    activeSection=section;

    updatePanelFrames();

    updateButtonStates();
}


/* =========================================================
   F1 TV
========================================================= */

function openF1TV(){

    f1TVMode=true;

    setActiveSection("tv");


    if(
        f1TVWindow &&
        !f1TVWindow.closed
    ){

        f1TVWindow.focus();

        return;
    }


    f1TVWindow=
        window.open(
            "https://f1tv.formula1.com/",
            "F1TV_Main"
        );
}


/* =========================================================
   MULTIVIEW
========================================================= */

function openMultiView(){

    setActiveSection("multi");


    if(
        multiViewWindow &&
        !multiViewWindow.closed
    ){

        multiViewWindow.focus();

        return;
    }


    multiViewWindow=
        window.open(
            "https://f1tv.formula1.com/",
            "F1TV_Multiview"
        );
}


/* =========================================================
   CHANGE MULTIVIEW
========================================================= */

function cycleMultiView(){

    selectedView++;

    if(
        selectedView>=
        multiViews.length
    ){

        selectedView=0;
    }


    const oldTexture=
        multiPanel
            .userData
            .screen
            .material
            .map;


    if(oldTexture){

        oldTexture.dispose();
    }


    multiPanel
        .userData
        .screen
        .material
        .map=
            multiTexture();


    multiPanel
        .userData
        .screen
        .material
        .needsUpdate=true;
}


/* =========================================================
   TIMING
========================================================= */

function toggleTiming(){

    timingVisible=
        !timingVisible;


    timingPanel.visible=
        timingVisible;


    if(timingVisible){

        setActiveSection(
            "timing"
        );

    }else{

        if(
            activeSection===
            "timing"
        ){

            setActiveSection(
                null
            );
        }
    }
}


/* =========================================================
   RESET
========================================================= */

function closeF1Windows(){

    if(
        f1TVWindow &&
        !f1TVWindow.closed
    ){

        f1TVWindow.close();
    }


    if(
        multiViewWindow &&
        !multiViewWindow.closed
    ){

        multiViewWindow.close();
    }


    f1TVWindow=null;

    multiViewWindow=null;


    f1TVMode=false;

    activeSection=null;


    timingVisible=true;

    multiVisible=true;


    timingPanel.visible=true;

    multiPanel.visible=true;


    selectedView=0;


    const oldTexture=
        multiPanel
            .userData
            .screen
            .material
            .map;


    if(oldTexture){

        oldTexture.dispose();
    }


    multiPanel
        .userData
        .screen
        .material
        .map=
            multiTexture();


    multiPanel
        .userData
        .screen
        .material
        .needsUpdate=true;


    updatePanelFrames();

    updateButtonStates();
}


/* =========================================================
   VR BUTTONS
========================================================= */

const interactiveObjects=[];

const buttonGroups=[];


function textSprite(
    text,
    size=30,
    color="#ffffff"
){

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=512;

    canvas.height=128;


    const ctx=
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        512,
        128
    );


    ctx.fillStyle=color;

    ctx.font=
        `bold ${size}px Arial`;

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.fillText(
        text,
        256,
        64
    );


    const texture=
        new THREE.CanvasTexture(
            canvas
        );


    const material=
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true,
            depthTest:false
        });


    const sprite=
        new THREE.Sprite(
            material
        );


    sprite.scale.set(
        .36,
        .09,
        1
    );


    return sprite;
}


function iconSprite(
    icon
){

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=128;

    canvas.height=128;


    const ctx=
        canvas.getContext("2d");


    ctx.fillStyle="#ffffff";

    ctx.font=
        "bold 58px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.fillText(
        icon,
        64,
        64
    );


    const texture=
        new THREE.CanvasTexture(
            canvas
        );


    const material=
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true,
            depthTest:false
        });


    const sprite=
        new THREE.Sprite(
            material
        );


    sprite.scale.set(
        .105,
        .105,
        1
    );


    return sprite;
}


/* =========================================================
   CREATE VR BUTTON
========================================================= */

function vrButton(
    icon,
    label,
    position,
    action
){

    const group=
        new THREE.Group();


    group.position.set(
        position[0],
        position[1],
        position[2]
    );


    const background=
        new THREE.Mesh(

            new THREE.CircleGeometry(
                .105,
                32
            ),

            new THREE.MeshBasicMaterial({
                color:0x101214,
                transparent:true,
                opacity:.97
            })

        );


    group.add(background);


    const ring=
        new THREE.Mesh(

            new THREE.RingGeometry(
                .105,
                .118,
                32
            ),

            new THREE.MeshBasicMaterial({
                color:0x4d5155
            })

        );


    group.add(ring);


    const iconMesh=
        iconSprite(icon);

    iconMesh.position.z=.01;

    group.add(iconMesh);


    const labelMesh=
        textSprite(
            label,
            28,
            "#bbbbbb"
        );


    labelMesh.position.set(
        .29,
        0,
        .01
    );


    labelMesh.scale.set(
        .42,
        .075,
        1
    );


    group.add(labelMesh);


    const hit=
        new THREE.Mesh(

            new THREE.CircleGeometry(
                .16,
                32
            ),

            new THREE.MeshBasicMaterial({
                transparent:true,
                opacity:0
            })

        );


    hit.userData.action=
        action;

    hit.userData.ring=
        ring;


    group.add(hit);


    interactiveObjects.push(
        hit
    );


    buttonGroups.push({

        group:group,

        ring:ring,

        label:labelMesh,

        action:action

    });


    world.add(group);


    return group;
}

/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtonStates(){

    buttonGroups.forEach(
        button=>{

            let active=false;


            if(
                button.action==="tv" &&
                activeSection==="tv"
            ){

                active=true;
            }


            if(
                button.action==="multi" &&
                activeSection==="multi"
            ){

                active=true;
            }


            if(
                button.action==="timing" &&
                activeSection==="timing"
            ){

                active=true;
            }


            button.ring
                .material
                .color
                .set(
                    active
                    ?0xe10600
                    :0x4d5155
                );


            button.label
                .material
                .opacity=
                    active
                    ?1
                    :.72;
        }
    );
}


updateButtonStates();


/* =========================================================
   CONTROLLERS
========================================================= */

const controller1 =
    renderer.xr.getController(0);

const controller2 =
    renderer.xr.getController(1);


scene.add(controller1);

scene.add(controller2);


const raycaster =
    new THREE.Raycaster();


const tempMatrix =
    new THREE.Matrix4();


let hoveredObject=null;


/* =========================================================
   CONTROLLER RAY
========================================================= */

function getControllerHit(
    controller
){

    tempMatrix
        .identity()
        .extractRotation(
            controller.matrixWorld
        );


    raycaster.ray.origin
        .setFromMatrixPosition(
            controller.matrixWorld
        );


    raycaster.ray.direction.set(
        0,
        0,
        -1
    );


    raycaster.ray.direction
        .applyMatrix4(
            tempMatrix
        );


    const hits=
        raycaster.intersectObjects(
            interactiveObjects,
            false
        );


    if(
        hits.length
    ){

        return hits[0].object;
    }


    return null;
}


/* =========================================================
   CONTROLLER ACTION
========================================================= */

function controllerAction(
    controller
){

    const hit=
        getControllerHit(
            controller
        );


    if(!hit){

        return;
    }


    switch(
        hit.userData.action
    ){

        case "tv":

            openF1TV();

            break;


        case "multi":

            cycleMultiView();

            openMultiView();

            break;


        case "timing":

            toggleTiming();

            break;


        case "close":

            closeF1Windows();

            break;

    }
}


/* =========================================================
   SELECT EVENTS
========================================================= */

controller1.addEventListener(
    "selectstart",
    ()=>{
        controllerAction(
            controller1
        );
    }
);


controller2.addEventListener(
    "selectstart",
    ()=>{
        controllerAction(
            controller2
        );
    }
);


/* =========================================================
   HIGHLIGHT
========================================================= */

function highlightController(
    controller
){

    const hit=
        getControllerHit(
            controller
        );


    if(
        hoveredObject &&
        hoveredObject!==hit
    ){

        hoveredObject
            .userData
            .ring
            .material
            .color
            .set(
                0x4d5155
            );
    }


    hoveredObject=hit;


    updateButtonStates();


    if(hit){

        hit.userData
            .ring
            .material
            .color
            .set(
                0xff2200
            );
    }
}


/* =========================================================
   ANIMATION
========================================================= */

const clock=
    new THREE.Clock();


function animate(){

    const elapsed=
        clock.getElapsedTime();


    /* cars */

    cars.forEach(
        car=>{

            const t=
                (
                    elapsed*.035+
                    car.offset
                )%1;


            const p=
                track.getPointAt(t);


            const tangent=
                track
                    .getTangentAt(t)
                    .normalize();


            car.mesh.position.copy(
                p
            );


            car.mesh.position.y=
                .40;


            car.mesh.rotation.y=
                Math.atan2(
                    tangent.x,
                    tangent.z
                );
        }
    );


    highlightController(
        controller1
    );


    highlightController(
        controller2
    );


    renderer.render(
        scene,
        camera
    );
}


renderer.setAnimationLoop(
    animate
);


/* =========================================================
   START
========================================================= */

document
    .getElementById("start")
    .addEventListener(
        "click",
        async()=>{

            document
                .getElementById("menu")
                .style.display="none";


            if(
                navigator.xr &&
                await navigator.xr
                    .isSessionSupported(
                        "immersive-ar"
                    )
            ){

                const session=
                    await navigator.xr
                        .requestSession(
                            "immersive-ar",
                            {
                                requiredFeatures:[
                                    "local-floor"
                                ]
                            }
                        );


                renderer.xr.setSession(
                    session
                );

            }else{

                alert(
                    "Immersive AR is not available on this device."
                );
            }
        }
    );


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);
