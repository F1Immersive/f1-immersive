<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Immersive</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

#menu{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,#292929,#000);
    z-index:5;
}

.box{
    width:min(90vw,520px);
    padding:35px;
    text-align:center;
    background:#111;
    border:1px solid #555;
    border-radius:24px;
}

h1{
    font-size:42px;
    margin:0 0 8px;
}

p{
    color:#aaa;
    line-height:1.5;
}

button{
    padding:16px 24px;
    margin:7px;
    border:0;
    border-radius:12px;
    background:#e10600;
    color:#fff;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button.alt{
    background:#333;
}

#status{
    margin-top:15px;
    color:#9f9;
    font-size:14px;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<div id="menu">

    <div class="box">

        <h1>🏁 F1 IMMERSIVE</h1>

        <p>
            Formula 1 Mixed Reality<br>
            Meta Quest 3
        </p>

        <button id="start">
            START IMMERSIVE
        </button>

        <button class="alt" id="tv">
            F1 TV
        </button>

        <button class="alt" id="multi">
            F1 TV MULTIVIEW
        </button>

        <div id="status">
            WebXR controleren…
        </div>

    </div>

</div>

<canvas id="c"></canvas>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   BASIS
===================================================== */

const menu =
document.querySelector("#menu");

const status =
document.querySelector("#status");


const scene =
new THREE.Scene();


const camera =
new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.01,
    100
);


const renderer =
new THREE.WebGLRenderer({

    canvas:
    document.querySelector("#c"),

    antialias:true,

    alpha:true

});


renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.xr.enabled = true;


/* =====================================================
   LICHT
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    )
);


const sun =
new THREE.DirectionalLight(
    0xffffff,
    4
);

sun.position.set(
    5,
    8,
    5
);

scene.add(sun);


/* =====================================================
   WERELD
===================================================== */

const world =
new THREE.Group();


/*
   Kleine baan vóór de gebruiker.
*/

world.position.set(
    0,
    -0.95,
    -3.1
);


/*
   Alles iets kleiner.
*/

world.scale.setScalar(
    0.78
);


scene.add(world);


/* =====================================================
   BASIS / TAFEL
===================================================== */

const platform =
new THREE.Mesh(

    new THREE.BoxGeometry(
        4.5,
        0.13,
        2.35
    ),

    new THREE.MeshStandardMaterial({
        color:0x173d1c
    })

);

platform.position.y =
-0.04;

world.add(platform);


const base =
new THREE.Mesh(

    new THREE.BoxGeometry(
        4.8,
        0.16,
        2.65
    ),

    new THREE.MeshStandardMaterial({
        color:0x101010
    })

);

base.position.y =
-0.16;

world.add(base);


/* =====================================================
   CIRCUIT
===================================================== */

const points = [

    [-1.65,-0.45],
    [-1.25,-0.88],
    [-0.35,-0.98],
    [0.65,-0.85],
    [1.45,-0.45],
    [1.62,0.10],
    [1.28,0.65],
    [0.45,0.78],
    [-0.45,0.72],
    [-1.48,0.50],
    [-1.72,0.02]

].map(

    p =>
    new THREE.Vector3(
        p[0],
        0,
        p[1]
    )

);


const track =
new THREE.CatmullRomCurve3(
    points,
    true
);


/* =====================================================
   ASFALT
===================================================== */

const road =
new THREE.Mesh(

    new THREE.TubeGeometry(
        track,
        220,
        0.205,
        14,
        true
    ),

    new THREE.MeshStandardMaterial({
        color:0x202020
    })

);

road.position.y =
0.07;

world.add(road);


/* =====================================================
   WITTE LIJN
===================================================== */

const line =
new THREE.Mesh(

    new THREE.TubeGeometry(
        track,
        220,
        0.012,
        6,
        true
    ),

    new THREE.MeshBasicMaterial({
        color:0xffffff
    })

);

line.position.y =
0.285;

world.add(line);


/* =====================================================
   KERBS
===================================================== */

for(let i=0;i<72;i++){

    const t =
    i / 72;

    const p =
    track.getPointAt(t);


    const kerb =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.055,
            0.018,
            0.10
        ),

        new THREE.MeshBasicMaterial({

            color:
            i % 2
            ? 0xffffff
            : 0xe10600

        })

    );


    kerb.position.set(
        p.x,
        0.30,
        p.z
    );


    world.add(kerb);

}


/* =====================================================
   START / FINISH
===================================================== */

const startFinish =
new THREE.Mesh(

    new THREE.BoxGeometry(
        0.09,
        0.02,
        0.50
    ),

    new THREE.MeshBasicMaterial({
        color:0xffffff
    })

);

startFinish.position.set(
    -1.60,
    0.31,
    -0.45
);

world.add(startFinish);


/* =====================================================
   F1 AUTO'S
===================================================== */

const colors = [

    0xe10600,
    0x1677ff,
    0xffd400,
    0x00c878,
    0xffffff,
    0xff7a00,
    0xb05cff,
    0x55c7ff

];


const cars = [];


function createCar(color){

    const group =
    new THREE.Group();


    const material =
    new THREE.MeshStandardMaterial({

        color:color,

        roughness:0.4

    });


    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.13,
            0.05,
            0.34
        ),

        material

    );

    group.add(body);


    const nose =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.045,
            0.03,
            0.17
        ),

        material

    );

    nose.position.z =
    -0.23;

    group.add(nose);


    const frontWing =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.21,
            0.015,
            0.045
        ),

        new THREE.MeshStandardMaterial({
            color:0x080808
        })

    );

    frontWing.position.z =
    -0.30;

    group.add(frontWing);


    const rearWing =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.20,
            0.025,
            0.04
        ),

        new THREE.MeshStandardMaterial({
            color:0x080808
        })

    );

    rearWing.position.z =
    0.17;

    group.add(rearWing);


    return group;

}


/* auto's maken */

for(let i=0;i<8;i++){

    const car =
    createCar(colors[i]);

    world.add(car);


    cars.push({

        mesh:car,

        t:i / 8,

        speed:
        0.00075 -
        i * 0.000018

    });

}


/* =====================================================
   TEXTURE VOOR SCHERMEN
===================================================== */

function createTexture(
    title,
    lines,
    width=700,
    height=400
){

    const canvas =
    document.createElement(
        "canvas"
    );

    canvas.width =
    width;

    canvas.height =
    height;


    const ctx =
    canvas.getContext(
        "2d"
    );


    ctx.fillStyle =
    "#090909";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.strokeStyle =
    "#555";

    ctx.lineWidth =
    4;

    ctx.strokeRect(
        2,
        2,
        width-4,
        height-4
    );


    ctx.fillStyle =
    "#ffffff";

    ctx.font =
    "bold 30px Arial";

    ctx.fillText(
        title,
        28,
        45
    );


    ctx.font =
    "20px Arial";

    ctx.fillStyle =
    "#bbbbbb";


    lines.forEach(
        (text,index)=>{

            ctx.fillText(
                text,
                28,
                85 + index * 32
            );

        }
    );


    return new THREE.CanvasTexture(
        canvas
    );

}


/* =====================================================
   SCHERM FUNCTIE
===================================================== */

function createPanel(
    title,
    lines,
    width,
    height,
    position,
    rotation=0
){

    const group =
    new THREE.Group();


    group.position.set(
        ...position
    );


    group.rotation.y =
    rotation;


    const frame =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            width + 0.10,
            height + 0.10,
            0.07
        ),

        new THREE.MeshStandardMaterial({
            color:0x080808
        })

    );


    const screen =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            height
        ),

        new THREE.MeshBasicMaterial({

            map:createTexture(
                title,
                lines
            )

        })

    );


    screen.position.z =
    -0.05;


    group.add(
        frame,
        screen
    );


    world.add(group);


    return group;

}


/* =====================================================
   HOOFDSCHERM F1 TV
===================================================== */

/*
   Iets groter + hoger.
*/

createPanel(

    "F1 TV",

    [
        "LIVE RACE",
        "Open F1 TV in browser",
        "Log in with your F1 TV account",
        "",
        "F1 TV MULTIVIEW →"
    ],

    3.95,
    2.05,

    [
        0,
        1.70,
        -0.42
    ]

);


/* =====================================================
   DATA RECHTS
===================================================== */

createPanel(

    "LIVE TIMING",

    [
        "1  VER   +0.000",
        "2  LEC   +2.735",
        "3  NOR   +3.219",
        "4  PIA   +4.669",
        "5  HAM   +5.601",
        "",
        "LAP 18 / 72"
    ],

    1.05,
    0.90,

    [
        2.18,
        1.12,
        -0.35
    ],

    -0.10

);


/* =====================================================
   MULTIVIEW
===================================================== */

createPanel(

    "F1 TV MULTIVIEW",

    [
        "MAIN FEED",
        "ONBOARD",
        "TRACK SIDE",
        "CAMERA 4",
        "",
        "OPEN EXTRA BROWSER →",
        "",
        "Login with F1 TV"
    ],

    1.28,
    1.35,

    [
        2.05,
        0.00,
        -0.30
    ],

    -0.08

);


/* =====================================================
   LINKER BEDIENING
===================================================== */

createPanel(

    "F1 IMMERSIVE",

    [
        "TERUG NAAR RACE",
        "F1 TV MULTIVIEW",
        "POSITIES & DATA",
        "INSTELLINGEN",
        "GELUID",
        "HELP",
        "AFSLUITEN"
    ],

    0.98,
    1.90,

    [
        -2.18,
        0.75,
        -0.25
    ],

    0.08

);


/* =====================================================
   ONDERSTE BEDIENING
===================================================== */

createPanel(

    "CONTROLS",

    [
        "CAMERA POSITIE",
        "BAAN HOOGTE",
        "SCHERM AFSTAND",
        "LICHT"
    ],

    2.20,
    0.42,

    [
        0,
        -0.55,
        -0.25
    ]

);


/* =====================================================
   AUTO ANIMATIE
===================================================== */

function updateCars(){

    cars.forEach(
        car=>{

            car.t +=
            car.speed;


            if(car.t >= 1){

                car.t -= 1;

            }


            const position =
            track.getPointAt(
                car.t
            );


            const tangent =
            track.getTangentAt(
                car.t
            );


            car.mesh.position.set(

                position.x,

                position.y + 0.33,

                position.z

            );


            car.mesh.rotation.y =
            Math.atan2(
                tangent.x,
                tangent.z
            );

        }
    );

}


/* =====================================================
   WEBXR CONTROLEREN
===================================================== */

async function checkXR(){

    if(!navigator.xr){

        status.textContent =
        "WebXR niet beschikbaar.";

        return false;

    }


    try{

        const supported =
        await navigator.xr.isSessionSupported(
            "immersive-ar"
        );


        if(supported){

            status.textContent =
            "✓ Quest 3 immersive AR beschikbaar";

        }else{

            status.textContent =
            "Immersive AR niet beschikbaar.";

        }


        return supported;

    }catch(error){

        console.error(error);

        status.textContent =
        "WebXR controle mislukt.";

        return false;

    }

}


/* =====================================================
   START IMMERSIVE
===================================================== */

document.querySelector(
    "#start"
).addEventListener(
    "click",
    async()=>{

        if(!await checkXR()){

            return;

        }


        try{

            const session =
            await navigator.xr.requestSession(

                "immersive-ar",

                {
                    requiredFeatures:[
                        "local-floor"
                    ]
                }

            );


            await renderer.xr.setSession(
                session
            );


            menu.style.display =
            "none";


            renderer.setAnimationLoop(
                ()=>{

                    updateCars();

                    renderer.render(
                        scene,
                        camera
                    );

                }
            );


        }catch(error){

            console.error(error);

            status.textContent =
            "Immersive starten mislukt.";

        }

    }
);


/* =====================================================
   F1 TV
===================================================== */

document.querySelector(
    "#tv"
).addEventListener(
    "click",
    ()=>{

        location.href =
        "https://f1tv.formula1.com/";

    }
);


/* =====================================================
   MULTIVIEW
===================================================== */

document.querySelector(
    "#multi"
).addEventListener(
    "click",
    ()=>{

        const newWindow =
        window.open(
            "https://f1tv.formula1.com/",
            "_blank"
        );


        /*
           Als de browser geen
           nieuw venster toestaat,
           openen we F1 TV normaal.
        */

        if(!newWindow){

            location.href =
            "https://f1tv.formula1.com/";

        }

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
        innerWidth /
        innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   START CHECK
===================================================== */

checkXR();

</script>

</body>
</html>
