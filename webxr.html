<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Immersive WebXR</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
    color:white;
}

#menu{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    background:radial-gradient(circle,#292929,#000);
}

.panel{
    width:min(90%,500px);
    padding:35px;
    text-align:center;
    background:rgba(15,15,15,.94);
    border:1px solid #555;
    border-radius:24px;
}

h1{
    font-size:42px;
    margin:0 0 10px;
}

p{
    color:#aaa;
}

button{
    border:0;
    border-radius:12px;
    padding:16px 24px;
    margin:8px;
    background:#e10600;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#status{
    margin-top:15px;
    font-size:14px;
    color:#8f8;
}

#fallback{
    display:none;
    margin-top:15px;
    color:#ffcc66;
}
</style>
</head>

<body>

<div id="menu">
    <div class="panel">

        <h1>🏁 F1 IMMERSIVE</h1>

        <p>
            Meta Quest 3 WebXR test
        </p>

        <button id="start">
            START IMMERSIVE
        </button>

        <div id="status">
            Checking WebXR...
        </div>

        <div id="fallback">
            Deze browser ondersteunt immersive AR niet.
        </div>

    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { ARButton } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js";


let scene;
let camera;
let renderer;
let cars = [];

const menu =
document.getElementById("menu");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const fallback =
document.getElementById("fallback");


/* --------------------------------------------------
   THREE.JS
-------------------------------------------------- */

scene = new THREE.Scene();

camera =
new THREE.PerspectiveCamera(
    70,
    window.innerWidth /
    window.innerHeight,
    0.01,
    100
);


/*
   Alpha is important:
   the real world can appear
   behind the virtual scene.
*/

renderer =
new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* --------------------------------------------------
   LIGHT
-------------------------------------------------- */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    )
);

const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    5,
    10,
    5
);

scene.add(light);


/* --------------------------------------------------
   TRACK
-------------------------------------------------- */

const track =
new THREE.Group();

track.position.set(
    0,
    -1.1,
    -2.5
);

track.rotation.x =
-0.02;

track.scale.set(
    1.2,
    1.2,
    1.2
);

scene.add(track);


/*
   Grass/base
*/

const base =
new THREE.Mesh(
    new THREE.CylinderGeometry(
        2.7,
        2.7,
        .08,
        64
    ),
    new THREE.MeshStandardMaterial({
        color:0x173c1b
    })
);

base.position.y =
-0.08;

track.add(base);


/*
   Track
*/

const trackCurve =
new THREE.CatmullRomCurve3([

    new THREE.Vector3(-2.0,0,-0.8),
    new THREE.Vector3(-1.5,0,-1.8),
    new THREE.Vector3(0.0,0,-2.1),
    new THREE.Vector3(1.7,0,-1.5),
    new THREE.Vector3(2.0,0,0.0),
    new THREE.Vector3(1.4,0,1.4),
    new THREE.Vector3(0.0,0,1.8),
    new THREE.Vector3(-1.8,0,1.2),
    new THREE.Vector3(-2.1,0,0.0),
    new THREE.Vector3(-1.2,0,-0.5)

],true);


/*
   Road tube
*/

const road =
new THREE.Mesh(
    new THREE.TubeGeometry(
        trackCurve,
        160,
        0.22,
        12,
        true
    ),
    new THREE.MeshStandardMaterial({
        color:0x202020
    })
);

track.add(road);


/*
   White racing line
*/

const racingLine =
new THREE.Mesh(
    new THREE.TubeGeometry(
        trackCurve,
        160,
        0.012,
        6,
        true
    ),
    new THREE.MeshBasicMaterial({
        color:0xffffff
    })
);

racingLine.position.y =
0.23;

track.add(racingLine);


/* --------------------------------------------------
   CARS
-------------------------------------------------- */

const carColors = [
    0xe10600,
    0x008cff,
    0xffff00,
    0x00ff66,
    0xffffff,
    0xff8800
];


for(let i=0;i<6;i++){

    const car =
    new THREE.Group();

    const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .16,
            .07,
            .38
        ),
        new THREE.MeshStandardMaterial({
            color:carColors[i]
        })
    );

    car.add(body);


    const nose =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .06,
            .035,
            .18
        ),
        new THREE.MeshStandardMaterial({
            color:carColors[i]
        })
    );

    nose.position.z =
    -0.25;

    car.add(nose);


    car.position.y =
    0.25;

    track.add(car);


    cars.push({
        mesh:car,
        progress:i/6,
        speed:.0008 - i*.00004
    });
}


/* --------------------------------------------------
   CAR ANIMATION
-------------------------------------------------- */

function updateCars(){

    cars.forEach(car => {

        car.progress +=
        car.speed;

        if(car.progress >= 1)
            car.progress -= 1;


        const position =
        trackCurve.getPointAt(
            car.progress
        );

        const tangent =
        trackCurve.getTangentAt(
            car.progress
        );

        car.mesh.position.x =
        position.x;

        car.mesh.position.y =
        position.y + .25;

        car.mesh.position.z =
        position.z;


        const angle =
        Math.atan2(
            tangent.x,
            tangent.z
        );

        car.mesh.rotation.y =
        angle;

    });

}


/* --------------------------------------------------
   WEBXR SUPPORT TEST
-------------------------------------------------- */

async function checkWebXR(){

    if(!navigator.xr){

        status.textContent =
        "WebXR niet beschikbaar.";

        fallback.style.display =
        "block";

        return false;
    }


    try{

        const supported =
        await navigator.xr.isSessionSupported(
            "immersive-ar"
        );


        if(supported){

            status.textContent =
            "✓ Immersive AR beschikbaar";

            return true;

        }else{

            status.textContent =
            "Immersive AR niet beschikbaar.";

            fallback.style.display =
            "block";

            return false;
        }

    }catch(error){

        status.textContent =
        "WebXR controle mislukt.";

        console.error(error);

        return false;
    }
}


/* --------------------------------------------------
   START IMMERSIVE
-------------------------------------------------- */

start.addEventListener(
"click",
async function(){

    status.textContent =
    "Starting WebXR...";


    const supported =
    await checkWebXR();


    if(!supported)
        return;


    try{

        const session =
        await navigator.xr.requestSession(
            "immersive-ar",
            {
                requiredFeatures:[
                    "local-floor"
                ]
            }
        );


        await renderer.xr.setSession(
            session
        );


        menu.style.display =
        "none";


        renderer.setAnimationLoop(
        function(){

            updateCars();

            renderer.render(
                scene,
                camera
            );

        });


    }catch(error){

        console.error(error);

        menu.style.display =
        "flex";

        status.textContent =
        "WebXR kon niet worden gestart.";

        fallback.style.display =
        "block";
    }

});


/* --------------------------------------------------
   RESIZE
-------------------------------------------------- */

window.addEventListener(
"resize",
function(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


checkWebXR();

</script>

</body>
</html>
