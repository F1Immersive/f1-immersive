<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Immersive</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  color:#fff;

}

#menu{

}

}

</style>
</head>

<body>

<div id="menu">

    <h1>F1 IMMERSIVE</h1>

    <p>
      Spatial Formula 1<br>
      Meta Quest 3
    </p>

    <button id="start">
      START IMMERSIVE
    </button>

    <button class="secondary" id="tv">
      F1 TV
    </button>

    <button class="secondary" id="multi">
      MULTIVIEW
    </button>

    <div id="status">
      WebXR controleren...
    </div>

  </div>

</div>

<canvas id="c"></canvas>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   BASIS
===================================================== */

const menu =
document.getElementById("menu");

const status =
document.getElementById("status");

const scene =
new THREE.Scene();

const camera =
new THREE.PerspectiveCamera(
  62,
  innerWidth / innerHeight,
  .01,
  100
);

const renderer =
new THREE.WebGLRenderer({

  canvas:
  document.getElementById("c"),

  antialias:true,

  alpha:true

});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.xr.enabled = true;


/* =====================================================
   LICHT
===================================================== */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x303030,
    3
  )
);

const light =
new THREE.DirectionalLight(
  0xffffff,
  3
);

light.position.set(4,8,5);

scene.add(light);


/* =====================================================
   WERELD
===================================================== */

const world =
new THREE.Group();

/*
   Ruimtelijke F1-opstelling
   Y = hoogte boven de vloer
*/

world.position.set(
  0,
  1.05,
  -3.25
);

/*
   Kleinere baan, meer zoals Lapz
*/

world.scale.setScalar(.48);

scene.add(world);

/* =====================================================
   BAAN
===================================================== */

const base =
new THREE.Mesh(

  new THREE.BoxGeometry(
  4.25,
  .15,
  2.35
),

  new THREE.MeshStandardMaterial({
    color:0x111315,
    roughness:.8
  })

);

base.position.y=-.17;

world.add(base);


const grass =
new THREE.Mesh(

  new THREE.BoxGeometry(
  4.02,
  .10,
  2.12
),

  new THREE.MeshStandardMaterial({
    color:0x203a25,
    roughness:.9
  })

);

grass.position.y=-.08;

world.add(grass);


/* =====================================================
   CIRCUIT
===================================================== */

const points = [

  [-1.65,-.45],
  [-1.25,-.88],
  [-.35,-.98],
  [.65,-.85],
  [1.45,-.45],
  [1.62,.10],
  [1.28,.65],
  [.45,.78],
  [-.45,.72],
  [-1.48,.50],
  [-1.72,.02]

].map(
  p => new THREE.Vector3(
    p[0],
    0,
    p[1]
  )
);

const track =
new THREE.CatmullRomCurve3(
  points,
  true
);


/* asfalt */

const road =
new THREE.Mesh(

  new THREE.TubeGeometry(
    track,
    280,
    .21,
    16,
    true
  ),

  new THREE.MeshStandardMaterial({
    color:0x25282b,
    roughness:.8
  })

);

road.position.y=.05;

world.add(road);


/* witte lijn */

const line =
new THREE.Mesh(

  new THREE.TubeGeometry(
    track,
    280,
    .012,
    6,
    true
  ),

  new THREE.MeshBasicMaterial({
    color:0xffffff
  })

);

line.position.y=.275;

world.add(line);


/* kerbs */

for(let i=0;i<90;i++){

  const p =
  track.getPointAt(i/90);

  const kerb =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      .055,
      .018,
      .105
    ),

    new THREE.MeshBasicMaterial({

      color:
      i%2
      ? 0xffffff
      : 0xe10600

    })

  );

  kerb.position.set(
    p.x,
    .29,
    p.z
  );

  world.add(kerb);
}


/* =====================================================
   AUTO'S
===================================================== */

const carColors = [
  0xe10600,
  0x1677ff,
  0xffd400,
  0x00c878,
  0xffffff,
  0xff7a00,
  0xb05cff,
  0x55c7ff
];

const cars=[];


function createCar(color){

  const g =
  new THREE.Group();

  const material =
  new THREE.MeshStandardMaterial({
    color,
    roughness:.35
  });


  const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .13,.05,.34
    ),
    material
  );

  g.add(body);


  const nose =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .045,.03,.18
    ),
    material
  );

  nose.position.z=-.23;

  g.add(nose);


  const frontWing =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .20,.015,.04
    ),
    new THREE.MeshStandardMaterial({
      color:0x080808
    })
  );

  frontWing.position.z=-.30;

  g.add(frontWing);


  const rearWing =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .19,.025,.04
    ),
    new THREE.MeshStandardMaterial({
      color:0x080808
    })
  );

  rearWing.position.z=.17;

  g.add(rearWing);

  return g;
}


for(let i=0;i<8;i++){

  const car =
  createCar(carColors[i]);

  world.add(car);

  cars.push({

    mesh:car,

    t:i/8,

    speed:
    .00072-i*.000014

  });

}


/* =====================================================
   PANEL TEXTURE
===================================================== */

function texture(
  title,
  rows,
  accent="#e10600"
){

  const canvas =
  document.createElement("canvas");

  canvas.width=900;
  canvas.height=520;

  const ctx =
  canvas.getContext("2d");


  ctx.fillStyle="#101214";

  ctx.fillRect(
    0,0,900,520
  );


  /* F1 rode accent */

  ctx.fillStyle=accent;

  ctx.fillRect(
    0,0,7,520
  );


  ctx.fillStyle="#fff";

  ctx.font=
  "bold 36px Arial";

  ctx.fillText(
    title,
    35,
    55
  );


  ctx.strokeStyle=
  "rgba(255,255,255,.15)";

  ctx.beginPath();

  ctx.moveTo(
    35,78
  );

  ctx.lineTo(
    865,78
  );

  ctx.stroke();


  ctx.font=
  "22px Arial";


  rows.forEach(
    (row,i)=>{

      ctx.fillStyle =
      i===0
      ? "#fff"
      : "#b9bec3";

      ctx.fillText(
        row,
        35,
        120+i*43
      );

    }
  );


  return new THREE.CanvasTexture(
    canvas
  );
}


/* =====================================================
   INTERACTIEVE PANELEN
===================================================== */

const interactiveObjects=[];


function panel(
  title,
  rows,
  width,
  height,
  position,
  rotation=0,
  accent="#e10600"
){

  const group =
  new THREE.Group();

  group.position.set(
    ...position
  );

  group.rotation.y=
  rotation;


  /* frame */

  const frame =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      width+.045,
      height+.045
    ),

    new THREE.MeshBasicMaterial({
      color:0x3d4145,
      transparent:true,
      opacity:.9
    })

  );

  group.add(frame);


  /* scherm */

  const screen =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      width,
      height
    ),

    new THREE.MeshBasicMaterial({
      map:
      texture(
        title,
        rows,
        accent
      )
    })

  );

  screen.position.z=-.03;

  group.add(screen);


  world.add(group);

  return group;
}


/* =====================================================
   INTERACTIEVE KNOP
===================================================== */

function vrButton(
  icon,
  label,
  position,
  action
){

  const group =
  new THREE.Group();

  group.position.set(
    ...position
  );


  /* =========================================
     RONDE KNOP
  ========================================= */

  const background =
  new THREE.Mesh(

    new THREE.CircleGeometry(
      .115,
      32
    ),

    new THREE.MeshBasicMaterial({
      color:0x101214,
      transparent:true,
      opacity:.96
    })

  );

  group.add(background);


  /* rode interactiering */

  const ring =
  new THREE.Mesh(

    new THREE.RingGeometry(
      .115,
      .127,
      32
    ),

    new THREE.MeshBasicMaterial({
      color:0x55585c
    })

  );

  group.add(ring);


  /* =========================================
     ICOON
  ========================================= */

  const c =
  document.createElement("canvas");

  c.width=256;
  c.height=256;

  const ctx =
  c.getContext("2d");

  ctx.clearRect(
    0,0,256,256
  );

  ctx.fillStyle="#ffffff";

  ctx.font=
  "bold 82px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    icon,
    128,
    128
  );


  const tex =
  new THREE.CanvasTexture(c);

  const sprite =
  new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:tex,
      transparent:true
    })
  );

  sprite.scale.set(
    .13,.13,.13
  );

  sprite.position.z=-.02;

  group.add(sprite);


  /* =========================================
     TEKST LABEL
  ========================================= */

  const labelCanvas =
  document.createElement("canvas");

  labelCanvas.width=500;
  labelCanvas.height=120;

  const labelCtx =
  labelCanvas.getContext("2d");

  labelCtx.fillStyle="#ffffff";

  labelCtx.font=
  "bold 48px Arial";

  labelCtx.textAlign="left";

  labelCtx.textBaseline="middle";

  labelCtx.fillText(
    label,
    15,
    60
  );


  const labelTexture =
  new THREE.CanvasTexture(
    labelCanvas
  );


  const labelSprite =
  new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:labelTexture,
      transparent:true
    })
  );


  labelSprite.scale.set(
    .52,
    .125,
    .125
  );

  labelSprite.position.set(
    .34,
    0,
    0
  );

  group.add(labelSprite);


  /* =========================================
     KLIKZONE
  ========================================= */

  const hit =
  new THREE.Mesh(

    new THREE.CircleGeometry(
      .17,
      32
    ),

    new THREE.MeshBasicMaterial({
      transparent:true,
      opacity:0
    })

  );

  hit.userData.action =
  action;

  hit.userData.label =
  label;

  hit.userData.group =
  group;

  group.add(hit);

  interactiveObjects.push(hit);

  world.add(group);

  return group;
}

/* =====================================================
   PANELEN
===================================================== */

const mainPanel =
panel(

  "F1 TV",

  [
    "LIVE RACE",
    "MAIN BROADCAST",
    "F1 TV ACCOUNT",
    "",
    "SELECT F1 TV"
  ],

  4.10,
  2.15,

  [0,1.48,-.70]

);


const timingPanel =
panel(

  "LIVE TIMING",

  [
    "P1  VER   +0.000",
    "P2  LEC   +2.735",
    "P3  NOR   +3.219",
    "P4  PIA   +4.669",
    "P5  HAM   +5.601",
    "",
    "LAP 18 / 72"
  ],

  1.35,
  1.35,

  [2.05,.82,-.48],

  -.10

);

const multiPanel =
panel(

  "MULTIVIEW",

  [
    "MAIN FEED",
    "ONBOARD",
    "TRACK CAMERA",
    "DRIVER CAMERA",
    "",
    "SELECT MULTIVIEW"
  ],

  1.35,
  1.15,

  [2.05,-.60,-.48],

  -.08

);


/* =====================================================
   VR BEDIENING
===================================================== */

const btnTV =
vrButton(
  "▶",
  "F1 TV",
  [-2.15,1.05,-.55],
  "tv"
);


const btnMulti =
vrButton(
  "▦",
  "MULTIVIEW",
  [-2.15,.68,-.55],
  "multi"
);


const btnTiming =
vrButton(
  "◉",
  "TIMING",
  [-2.15,.31,-.55],
  "timing"
);


const btnSettings =
vrButton(
  "⚙",
  "SETTINGS",
  [-2.15,.06,-.55],
  "settings"
);

const btnClose =
vrButton(
  "×",
  "CLOSE F1",
  [-2.15,-.43,-.55],
  "close"
);
  
/* =====================================================
   RAYCASTER
===================================================== */

const raycaster =
new THREE.Raycaster();

const tempMatrix =
new THREE.Matrix4();

const controllerStates=[];


/* =====================================================
   CONTROLLER
===================================================== */

function setupController(index){

  const controller =
  renderer.xr.getController(index);

  scene.add(controller);


  /*
     Rode richtlijn.
  */

  const lineGeometry =
  new THREE.BufferGeometry()
  .setFromPoints([

    new THREE.Vector3(
      0,0,0
    ),

    new THREE.Vector3(
      0,0,-3
    )

  ]);


  const line =
  new THREE.Line(

    lineGeometry,

    new THREE.LineBasicMaterial({
      color:0xe10600,
      transparent:true,
      opacity:.85
    })

  );

  controller.add(line);


  controller.addEventListener(
    "selectstart",
    ()=>{

      controllerStates[index]=true;

      selectController(
        controller
      );

    }
  );


  controller.addEventListener(
    "selectend",
    ()=>{

      controllerStates[index]=false;

    }
  );


  return controller;
}


const controllers=[
  setupController(0),
  setupController(1)
];


/* =====================================================
   CONTROLLER SELECTIE
===================================================== */

function selectController(
  controller
){

  tempMatrix.identity()
  .extractRotation(
    controller.matrixWorld
  );


  raycaster.ray.origin
  .setFromMatrixPosition(
    controller.matrixWorld
  );


  raycaster.ray.direction
  .set(
    0,0,-1
  )
  .applyMatrix4(
    tempMatrix
  );


  const hits =
  raycaster.intersectObjects(
    interactiveObjects,
    false
  );


  if(!hits.length)
    return;


  const object =
  hits[0].object;


  const action =
  object.userData.action;


  if(action==="tv"){

    openF1TV();

  }

  if(action==="multi"){

    openMultiView();

  }

  if(action==="timing"){

    toggleTiming();

  }

  if(action==="settings"){

    toggleSettings();

  }

  if(action==="close"){
  closeF1Windows();

  }  
  
}


/* =====================================================
   HIGHLIGHT
===================================================== */

function highlightController(
  controller
){

  tempMatrix.identity()
  .extractRotation(
    controller.matrixWorld
  );

  raycaster.ray.origin
  .setFromMatrixPosition(
    controller.matrixWorld
  );

  raycaster.ray.direction
  .set(
    0,0,-1
  )
  .applyMatrix4(
    tempMatrix
  );


  const hits =
  raycaster.intersectObjects(
    interactiveObjects,
    false
  );


  interactiveObjects.forEach(
    object=>{

      const group =
      object.userData.group;

      const ring =
      group.children[1];

      if(ring){

        ring.material.color.set(
          0x55585c
        );

      }

    }
  );


  if(hits.length){

    const group =
    hits[0].object.userData.group;

    const ring =
    group.children[1];

    if(ring){

      ring.material.color.set(
        0xe10600
      );

    }

  }

}


/* =====================================================
   FUNCTIES
===================================================== */

/* =========================================
   F1 TV VENSTERS
   Eén herbruikbare pagina per functie
========================================= */

/* =====================================================
   F1 TV VENSTERS
   Eén venster voor F1 TV
   Eén apart venster voor Multiview
===================================================== */

let f1TVWindow = null;
let multiViewWindow = null;


function openF1TV(){

  /*
     Bestaat het venster nog?
     Gebruik dan hetzelfde venster.
  */

  if(
    f1TVWindow &&
    !f1TVWindow.closed
  ){

    f1TVWindow.focus();

    return;
  }


  f1TVWindow =
  window.open(
    "https://f1tv.formula1.com/",
    "F1TV_Main"
  );


  /*
     Browser blokkeert eventueel
     een nieuw venster.
  */

  if(!f1TVWindow){

    console.warn(
      "F1 TV venster kon niet worden geopend."
    );

  }

}


function openMultiView(){

  /*
     Multiview heeft bewust
     een eigen venster.
  */

  if(
    multiViewWindow &&
    !multiViewWindow.closed
  ){

    multiViewWindow.focus();

    return;
  }


  multiViewWindow =
  window.open(
    "https://f1tv.formula1.com/",
    "F1TV_Multiview"
  );


  if(!multiViewWindow){

    console.warn(
      "Multiview venster kon niet worden geopend."
    );

  }

}


/* =====================================================
   F1 VENSTERS SLUITEN
===================================================== */

function closeF1Windows(){

  if(
    f1TVWindow &&
    !f1TVWindow.closed
  ){

    f1TVWindow.close();

  }


  if(
    multiViewWindow &&
    !multiViewWindow.closed
  ){

    multiViewWindow.close();

  }


  f1TVWindow = null;
  multiViewWindow = null;

}

let timingVisible=true;


function toggleTiming(){

  timingVisible=
  !timingVisible;

  timingPanel.visible=
  timingVisible;

}


let settingsVisible=false;


function toggleSettings(){

  settingsVisible=
  !settingsVisible;

}


/* =====================================================
   AUTO'S
===================================================== */

function updateCars(){

  cars.forEach(
    car=>{

      car.t+=car.speed;

      if(car.t>=1)
        car.t-=1;


      const p=
      track.getPointAt(
        car.t
      );


      const tangent=
      track.getTangentAt(
        car.t
      );


      car.mesh.position.set(
        p.x,
        .32,
        p.z
      );


      car.mesh.rotation.y=
      Math.atan2(
        tangent.x,
        tangent.z
      );

    }
  );

}


/* =====================================================
   WEBXR
===================================================== */

async function checkXR(){

  status.textContent =
    "WebXR controleren...";


  if(!navigator.xr){

    status.textContent =
      "WebXR niet beschikbaar.";

    return false;
  }


  try{

    const supported =
      await Promise.race([

        navigator.xr.isSessionSupported(
          "immersive-ar"
        ),

        new Promise(
          (_, reject) =>
            setTimeout(
              () => reject(
                new Error(
                  "WebXR timeout"
                )
              ),
              5000
            )
        )

      ]);


    status.textContent =
      supported
      ? "✓ Quest 3 immersive AR beschikbaar"
      : "Immersive AR niet beschikbaar.";


    return supported;

  }
  catch(error){

    console.error(
      "WebXR controle:",
      error
    );


    status.textContent =
      "WebXR klaar — probeer Immersive";


    return true;

  }

}
/* =====================================================
   START
===================================================== */

document.getElementById(
  "start"
).onclick=
async()=>{

  if(!await checkXR())
    return;


  try{

    const session=
    await navigator.xr.requestSession(

      "immersive-ar",

      {

        requiredFeatures:[
          "local-floor"
        ],

        optionalFeatures:[
          "hand-tracking",
          "bounded-floor"
        ]

      }

    );


    await renderer.xr.setSession(
      session
    );


    menu.style.display=
    "none";


    renderer.setAnimationLoop(
      ()=>{

        updateCars();


        /*
           Controller highlight.
        */

        controllers.forEach(
          controller=>{

            highlightController(
              controller
            );

          }
        );


        renderer.render(
          scene,
          camera
        );

      }
    );


  }
  catch(error){

    console.error(error);

    status.textContent=
    "Immersive starten mislukt.";

  }

};


/* =====================================================
   MENU KNOPPEN
===================================================== */

document.getElementById(
  "tv"
).onclick=
openF1TV;


document.getElementById(
  "multi"
).onclick=
openMultiView;


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
    innerWidth/
    innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


checkXR();

</script>
