<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F1 Immersive</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#menu {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #090909 65%,
            #000000 100%
        );

    z-index: 100;
}

.panel {

    width: min(90%, 500px);

    padding: 35px;

    text-align: center;

    border-radius: 24px;

    background: rgba(20,20,20,.92);

    border: 1px solid #555;

    box-shadow:
        0 20px 80px rgba(0,0,0,.8);
}

.logo {
    font-size: 46px;
    font-weight: 900;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

button {

    display: inline-block;

    border: none;

    border-radius: 12px;

    padding: 16px 25px;

    margin: 6px;

    font-size: 17px;

    font-weight: bold;

    color: white;

    background: #e10600;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

button.secondary {
    background: #333;
}

button:active {
    transform: scale(.96);
}

#experience {

    position: fixed;

    inset: 0;

    display: none;
}

canvas {

    width: 100%;
    height: 100%;

    display: block;
}

#hud {

    position: fixed;

    top: 20px;
    left: 20px;

    padding: 14px 18px;

    background: rgba(0,0,0,.75);

    border-radius: 12px;

    border: 1px solid #444;

    display: none;

    z-index: 20;
}

#hud strong {
    font-size: 17px;
}

#hud small {
    display: block;
    color: #aaa;
    margin-top: 4px;
}

#f1tv {

    position: fixed;

    top: 20px;
    right: 20px;

    display: none;

    z-index: 20;

    background: #e10600;
}

#message {

    margin-top: 15px;

    color: #8f8;

    font-size: 14px;
}

</style>

</head>

<body>

<!-- START MENU -->

<div id="menu">

    <div class="panel">

        <div class="logo">
            🏁 F1 IMMERSIVE
        </div>

        <div class="subtitle">
            Formula 1 • 3D Race Experience
        </div>

        <button id="startButton">
            START IMMERSIVE
        </button>

        <button id="tvButton" class="secondary">
            OPEN F1 TV
        </button>

        <div id="message"></div>

    </div>

</div>


<!-- EXPERIENCE -->

<div id="experience">

    <canvas id="canvas"></canvas>

</div>


<div id="hud">

    <strong>🏁 F1 IMMERSIVE</strong>

    <small>
        Meta Quest 3 • 3D Track
    </small>

</div>


<button id="f1tv">
    F1 TV
</button>


<script>

/*
==========================================================
F1 IMMERSIVE
Simple browser version
Works on iPhone / Safari / Quest Browser
==========================================================
*/


const menu =
    document.getElementById("menu");

const experience =
    document.getElementById("experience");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startButton =
    document.getElementById("startButton");

const tvButton =
    document.getElementById("tvButton");

const f1tv =
    document.getElementById("f1tv");

const hud =
    document.getElementById("hud");

const message =
    document.getElementById("message");


/*
----------------------------------------------------------
Canvas
----------------------------------------------------------
*/

function resizeCanvas() {

    canvas.width =
        window.innerWidth *
        window.devicePixelRatio;

    canvas.height =
        window.innerHeight *
        window.devicePixelRatio;

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/*
----------------------------------------------------------
F1 cars
----------------------------------------------------------
*/

const cars = [

    {
        position: 0,
        speed: .00055,
        color: "#e10600",
        number: "1"
    },

    {
        position: .18,
        speed: .00050,
        color: "#00aaff",
        number: "2"
    },

    {
        position: .36,
        speed: .00048,
        color: "#ffff00",
        number: "3"
    },

    {
        position: .55,
        speed: .00046,
        color: "#00ff66",
        number: "4"
    },

    {
        position: .73,
        speed: .00044,
        color: "#ffffff",
        number: "5"
    },

    {
        position: .88,
        speed: .00042,
        color: "#ff8800",
        number: "6"
    }

];


/*
----------------------------------------------------------
Track
----------------------------------------------------------
*/

function drawTrack() {

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    const cx =
        w / 2;

    const cy =
        h / 2 + 30;

    const scale =
        Math.min(w,h) / 900;


    ctx.save();

    ctx.translate(cx,cy);

    ctx.scale(scale,scale);


    /*
    Shadow
    */

    ctx.beginPath();

    ctx.ellipse(
        0,
        40,
        360,
        230,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.5)";

    ctx.fill();


    /*
    Grass
    */

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        350,
        220,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#163d1c";

    ctx.fill();


    /*
    Outer track
    */

    ctx.beginPath();

    ctx.moveTo(-280,-80);

    ctx.bezierCurveTo(
        -250,-250,
        20,-280,
        220,-180
    );

    ctx.bezierCurveTo(
        380,-100,
        350,130,
        160,200
    );

    ctx.bezierCurveTo(
        -40,270,
        -300,190,
        -290,30
    );

    ctx.bezierCurveTo(
        -285,-30,
        -220,-45,
        -160,-20
    );

    ctx.bezierCurveTo(
        -80,15,
        -10,60,
        60,25
    );

    ctx.bezierCurveTo(
        130,-10,
        145,-80,
        85,-115
    );

    ctx.bezierCurveTo(
        0,-165,
        -100,-145,
        -140,-70
    );

    ctx.lineWidth = 52;

    ctx.lineCap =
        "round";

    ctx.strokeStyle =
        "#333";

    ctx.stroke();


    /*
    Track surface
    */

    ctx.beginPath();

    ctx.moveTo(-280,-80);

    ctx.bezierCurveTo(
        -250,-250,
        20,-280,
        220,-180
    );

    ctx.bezierCurveTo(
        380,-100,
        350,130,
        160,200
    );

    ctx.bezierCurveTo(
        -40,270,
        -300,190,
        -290,30
    );

    ctx.bezierCurveTo(
        -285,-30,
        -220,-45,
        -160,-20
    );

    ctx.bezierCurveTo(
        -80,15,
        -10,60,
        60,25
    );

    ctx.bezierCurveTo(
        130,-10,
        145,-80,
        85,-115
    );

    ctx.bezierCurveTo(
        0,-165,
        -100,-145,
        -140,-70
    );

    ctx.lineWidth = 38;

    ctx.strokeStyle =
        "#171717";

    ctx.stroke();


    /*
    Kerbs
    */

    ctx.lineWidth = 5;

    ctx.setLineDash([
        8,
        8
    ]);

    ctx.strokeStyle =
        "#ffffff";

    ctx.stroke();


    ctx.setLineDash([]);


    /*
    Start finish
    */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        -190,
        -100,
        6,
        55
    );


    ctx.restore();

}


/*
----------------------------------------------------------
Car position
----------------------------------------------------------
*/

function getTrackPosition(t) {

    const angle =
        t * Math.PI * 2;


    const x =
        Math.sin(angle) *
        240;


    const y =
        Math.cos(angle) *
        130;


    return {
        x,
        y
    };

}


/*
----------------------------------------------------------
Draw car
----------------------------------------------------------
*/

function drawCar(car) {

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    const scale =
        Math.min(w,h) / 900;

    const cx =
        w / 2;

    const cy =
        h / 2 + 30;


    const pos =
        getTrackPosition(
            car.position
        );


    const x =
        cx + pos.x * scale;

    const y =
        cy + pos.y * scale;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.scale(
        scale,
        scale
    );


    /*
    Shadow
    */

    ctx.fillStyle =
        "rgba(0,0,0,.6)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        7,
        16,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
    Car
    */

    ctx.fillStyle =
        car.color;

    ctx.fillRect(
        -13,
        -5,
        26,
        10
    );


    /*
    Nose
    */

    ctx.fillRect(
        10,
        -2,
        12,
        4
    );


    /*
    Number
    */

    ctx.fillStyle =
        "#000";

    ctx.font =
        "bold 8px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        car.number,
        0,
        3
    );


    ctx.restore();

}


/*
----------------------------------------------------------
Animation
----------------------------------------------------------
*/

let running = false;

function animate() {

    if (!running) {
        return;
    }


    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    /*
    Background
    */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            window.innerHeight
        );

    gradient.addColorStop(
        0,
        "#101015"
    );

    gradient.addColorStop(
        1,
        "#020202"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    drawTrack();


    /*
    Move cars
    */

    cars.forEach(
        car => {

            car.position +=
                car.speed;

            if(
                car.position >= 1
            ) {

                car.position -= 1;

            }

            drawCar(car);

        }
    );


    /*
    Title
    */

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 22px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "F1 IMMERSIVE",
        window.innerWidth / 2,
        45
    );


    requestAnimationFrame(
        animate
    );

}


/*
----------------------------------------------------------
START BUTTON
----------------------------------------------------------
*/

startButton.addEventListener(
    "click",
    function() {

        menu.style.display =
            "none";

        experience.style.display =
            "block";

        hud.style.display =
            "block";

        f1tv.style.display =
            "block";

        running = true;

        animate();

    }
);


/*
----------------------------------------------------------
F1 TV
----------------------------------------------------------
*/

function openF1TV() {

    window.location.href =
        "https://f1tv.formula1.com/";

}

tvButton.addEventListener(
    "click",
    openF1TV
);

f1tv.addEventListener(
    "click",
    openF1TV
);


/*
----------------------------------------------------------
Page loaded
----------------------------------------------------------
*/

message.textContent =
    "Ready — Quest 3 / iPhone compatible preview";

</script>

</body>
</html>
